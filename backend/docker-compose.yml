services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ziptrip
      POSTGRES_PASSWORD: ziptrip
      POSTGRES_DB: ziptrip_todos
    ports:
      - "5432:5432"
    volumes:
      - ziptrip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziptrip -d ziptrip_todos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ziptrip_pgdata:
